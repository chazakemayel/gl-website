<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Water Audit • Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body{margin:0;font-family:Poppins,Arial;background:linear-gradient(180deg,#e9f9ee,#eaf2f9);display:flex;align-items:center;justify-content:center;min-height:100vh}
    .card{background:#fff;padding:28px;border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.08);width:min(420px,92vw);border:1px solid #e5e7eb}
    h2{margin:0 0 8px}
    .sub{color:#64748b;margin:0 0 12px}
    input{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:10px;background:#f8fafc;margin-bottom:12px}
    .btn{padding:12px;width:100%;border:none;background:#00a651;color:#fff;font-weight:800;border-radius:10px;cursor:pointer}
    .note{margin-top:10px;font-size:14px;color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;padding:8px;border-radius:10px}
    .good{color:#065f46;background:#ecfdf5;border-color:#bbf7d0}
  </style>
  <script>const API_BASE = "https://gl-website-8.onrender.com"; </script>
</head>
<body>
  <div class="card">
    <h2>Reset Password</h2>
    <p class="sub">Enter a new password for your account.</p>
    <form id="form">
      <input id="pwd" type="password" placeholder="New password" required />
      <button class="btn">Set New Password</button>
    </form>
    <div id="note" class="note" style="display:none"></div>
  </div>

<script>
  const params=new URLSearchParams(location.search);
  const token=params.get('token');
  const $=s=>document.querySelector(s);
  $('#form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const newPassword = $('#pwd').value.trim();
    const note = $('#note'); note.style.display='block'; note.className='note';
    try{
      const r = await fetch(`${API_BASE}/api/auth/reset-password`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({token,newPassword})
      });
      if(!r.ok){ note.textContent = await r.text(); return; }
      note.textContent='✅ Password reset successfully. You may close this tab.';
      note.classList.add('good');
    }catch{ note.textContent='Network error.'; }
  });
</script>
</body>
</html>
