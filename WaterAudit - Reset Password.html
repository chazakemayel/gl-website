<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Water Audit • Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body{
      margin:0;
      font-family:Poppins,Arial;
      background:linear-gradient(180deg,#e9f9ee,#eaf2f9);
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh
    }
    .card{
      background:#fff;
      padding:28px;
      border-radius:16px;
      box-shadow:0 12px 36px rgba(0,0,0,.08);
      width:min(420px,92vw);
      border:1px solid #e5e7eb
    }
    h2{margin:0 0 8px}
    .sub{color:#64748b;margin:0 0 12px}
    input{
      width:100%;
      padding:12px;
      border:1px solid #e5e7eb;
      border-radius:10px;
      background:#f8fafc;
      margin-bottom:12px
    }
    .btn{
      padding:12px;
      width:100%;
      border:none;
      background:#00a651;
      color:#fff;
      font-weight:800;
      border-radius:10px;
      cursor:pointer
    }
    .note{
      margin-top:10px;
      font-size:14px;
      color:#9a3412;
      background:#fff7ed;
      border:1px solid #fed7aa;
      padding:8px;
      border-radius:10px;
      display:none;
    }
    .note.good{
      color:#065f46;
      background:#ecfdf5;
      border-color:#bbf7d0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Reset Password</h2>
    <p class="sub">Enter a new password for your account.</p>
    <form id="form">
      <input id="pwd" type="password" placeholder="New password" required />
      <button class="btn" type="submit">Set New Password</button>
    </form>
    <div id="note" class="note"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      getAuth,
      verifyPasswordResetCode,
      confirmPasswordReset
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    // ✅ IMPORTANT: copy the SAME config you used in your Login page
    const firebaseConfig = {
      apiKey: "AIzaSyAgQJ7VR7L8qHcntwO2oO3Abh35kLGtds",
      authDomain: "green-leaders-water-audit.firebaseapp.com",
      projectId: "green-leaders-water-audit",
      storageBucket: "green-leaders-water-audit.firebasestorage.app",
      messagingSenderId: "594962552208",
      appId: "1:594962552208:web:debc691066c3988156276d",
      measurementId: "G-X604FHQC1M"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const params = new URLSearchParams(location.search);
    const oobCode = params.get("oobCode");   // Firebase reset token
    const form = document.getElementById("form");
    const pwdInput = document.getElementById("pwd");
    const note = document.getElementById("note");

    function show(msg, good = false) {
      note.style.display = "block";
      note.textContent = msg;
      note.className = "note" + (good ? " good" : "");
    }

    // 🔎 1) Check that the reset link is valid
    if (!oobCode) {
      show("Invalid password reset link. Please request a new reset email.");
      form.style.display = "none";
    } else {
      verifyPasswordResetCode(auth, oobCode).catch(() => {
        show("This password reset link is invalid or has expired. Please request a new reset email.");
        form.style.display = "none";
      });
    }

    // ✅ 2) When user submits new password
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const newPassword = pwdInput.value.trim();

      if (!newPassword || newPassword.length < 6) {
        return show("Please choose a password of at least 6 characters.");
      }

      try {
        await confirmPasswordReset(auth, oobCode, newPassword);
        show("✅ Password reset successfully. You can now close this tab and log in with your new password.", true);
        form.style.display = "none";
      } catch (err) {
        console.error(err);
        show(err.message);
      }
    });
  </script>
</body>
</html>
