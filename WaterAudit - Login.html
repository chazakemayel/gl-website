<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Water Audit • Login / Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--green:#00a651;--line:#e5e7eb}
    *{box-sizing:border-box}
    body{margin:0;font-family:Poppins,Arial;background:linear-gradient(180deg,#e9f9ee,#eaf2f9)}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.08);width:min(780px,96vw);overflow:hidden}
    .head{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:18px 24px;font-weight:800}
    .tabs{display:flex;border-bottom:1px solid var(--line)}
    .tab{flex:1;text-align:center;padding:10px;cursor:pointer;font-weight:700;color:#334155}
    .tab.active{color:#0f172a;border-bottom:2px solid var(--green)}
    .body{padding:24px}
    form{display:grid;gap:12px}
    .row{display:grid;gap:12px}
    @media(min-width:760px){.row{grid-template-columns:1fr 1fr}}
    label{display:block;font-size:13px;color:#334155;margin-bottom:6px}
    input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}
    .btn{padding:12px;background:var(--green);color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer}
    .btn.secondary{background:#0ea5e9}
    .btn.ghost{background:#fff;color:#0f172a;border:1px solid var(--line)}
    .note{padding:10px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
    .note.good{background:#ecfdf5;border-color:#bbf7d0;color:#065f46}
    .note.hide{display:none}
    .hide{display:none}
    .sub{color:#64748b;font-size:14px}
    a.link{color:#0ea5e9;text-decoration:none;font-weight:700}
    .footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:16px 24px;color:#475569}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <img src="images/GLLOGO.png" alt="logo" style="height:32px" onerror="this.style.display='none'">
        <span>Green Leaders — Water Audit</span>
      </div>

      <div class="tabs">
        <div id="tabLogin"  class="tab active">Login</div>
        <div id="tabSignup" class="tab">Sign Up</div>
      </div>

      <!-- LOGIN -->
      <section id="loginView" class="body">
        <div>
          <h1 style="margin:0 0 8px">Welcome back</h1>
          <p class="sub">Sign in to access your dashboard</p>
        </div>
        <div id="login_note" class="note hide"></div>

        <form id="loginForm">
          <div class="row">
            <div>
              <label>Email Address</label>
              <input id="login_email" type="email" placeholder="you@school.edu" required />
            </div>
            <div>
              <label>Password</label>
              <input id="login_pwd" type="password" placeholder="********" required />
            </div>
          </div>

          <div class="row" style="align-items:center">
            <button class="btn" type="submit">Sign in</button>
            <div style="display:flex; align-items:center; gap:10px">
              <span class="sub">No account?</span>
              <a id="goSignup" class="link" href="#">Create one</a>
            </div>
          </div>

          <div style="margin-top:6px; font-size:14px;">
            Didn’t get the verification email?
            <a href="#" id="resendLink" class="link">Resend verification</a>
          </div>
          <div style="margin-top:6px; font-size:14px;">
            <a href="#" id="forgotLink" class="link">Forgot password?</a>
          </div>
        </form>
      </section>

      <!-- SIGNUP -->
      <section id="signupView" class="body hide">
        <div>
          <h1 style="margin:0 0 8px">Create account</h1>
          <p class="sub">Sign up to start managing your water audit</p>
        </div>
        <div id="signup_note" class="note hide"></div>

        <form id="signupForm">
          <div class="row">
            <div>
              <label>Full Name</label>
              <input id="su_name" type="text" placeholder="Your name" required />
            </div>
            <div>
              <label>Email Address</label>
              <input id="su_email" type="email" placeholder="you@school.edu" required />
            </div>
          </div>

          <div class="row">
            <div>
              <label>Password</label>
              <input id="su_pwd" type="password" placeholder="********" required />
            </div>
            <div>
              <label>Confirm Password</label>
              <input id="su_pwd2" type="password" placeholder="********" required />
            </div>
          </div>

          <div class="row">
            <div>
              <label>Building Name</label>
              <input id="su_building_name" type="text" placeholder="e.g. Campus 1 – Block A" required />
            </div>
            <div>
              <label>Building Location</label>
              <input id="su_building_location" type="text" placeholder="e.g. Beirut, Lebanon" required />
            </div>
          </div>

          <!-- OTP block kept but always hidden (design unchanged) -->
          <div id="otpBlock" class="row hide">
            <div>
              <label>Verification Code (sent to your email)</label>
              <input id="su_code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" />
            </div>
            <div style="display:flex; align-items:flex-end;">
              <button id="resendOtpBtn" type="button" class="btn secondary" style="width:100%;">Resend Code</button>
            </div>
          </div>

          <button class="btn" type="submit" id="signupBtn">Create Account</button>
        </form>
      </section>

      <div class="footer">
        <div>© Green Leaders</div>
        <div><a class="link" href="#">Need help?</a></div>
      </div>
    </div>
  </div>

  <!-- Firebase + logic -->
  <script type="module">
    // -----------------------------
    //  Firebase imports & config
    // -----------------------------
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendEmailVerification,
      sendPasswordResetEmail,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // TODO: 🔴 Replace with your real config from Firebase console
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAqGQJ7VR7L8qHcntwO2oO3ADh35kLGTds",
  authDomain: "green-leaders-water-audit.firebaseapp.com",
  projectId: "green-leaders-water-audit",
  storageBucket: "green-leaders-water-audit.firebasestorage.app",
  messagingSenderId: "594962525208",
  appId: "1:594962525208:web:debc691066c3908156276d",
  measurementId: "G-X604FHQC1M"
};


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // -----------------------------
    //  Helper functions
    // -----------------------------
    const $ = s => document.querySelector(s);

    function note(el, msg, type) {
      if (!el) return;
      if (!msg) {
        el.classList.add("hide");
        el.textContent = "";
        el.classList.remove("good");
        return;
      }
      el.textContent = msg;
      el.classList.remove("hide");
      el.classList.toggle("good", type === "good");
    }

    function switchTab(which) {
      if (which === "login") {
        $("#loginView").classList.remove("hide");
        $("#signupView").classList.add("hide");
        $("#tabLogin").classList.add("active");
        $("#tabSignup").classList.remove("active");
      } else {
        $("#signupView").classList.remove("hide");
        $("#loginView").classList.add("hide");
        $("#tabSignup").classList.add("active");
        $("#tabLogin").classList.remove("active");
      }
    }

    // -----------------------------
    //  DOM elements
    // -----------------------------
    const loginForm = $("#loginForm");
    const loginEmail = $("#login_email");
    const loginPwd = $("#login_pwd");
    const loginNote = $("#login_note");
    const forgotLink = $("#forgotLink");
    const resendLink = $("#resendLink");

    const signupForm = $("#signupForm");
    const signupNote = $("#signup_note");
    const suName = $("#su_name");
    const suEmail = $("#su_email");
    const suPwd = $("#su_pwd");
    const suPwd2 = $("#su_pwd2");
    const suBuildingName = $("#su_building_name");
    const suBuildingLocation = $("#su_building_location");

    // -----------------------------
    //  Auto redirect if already logged in & verified
    // -----------------------------
    onAuthStateChanged(auth, async (user) => {
      if (user && user.emailVerified) {
        // Optional: load profile from Firestore
        try {
          const snap = await getDoc(doc(db, "users", user.uid));
          const profile = snap.exists() ? snap.data() : {};
          localStorage.setItem("gl_user", JSON.stringify({
            uid: user.uid,
            email: user.email,
            ...profile
          }));
          const token = await user.getIdToken();
          localStorage.setItem("gl_token", token);
        } catch (e) {
          console.error(e);
        }
        window.location.href = "WaterAudit - Dashboard.html";
      }
    });

    // -----------------------------
    //  Tab switching
    // -----------------------------
    $("#tabLogin").addEventListener("click", () => switchTab("login"));
    $("#tabSignup").addEventListener("click", () => switchTab("signup"));
    $("#goSignup").addEventListener("click", (e) => {
      e.preventDefault();
      switchTab("signup");
    });

    // -----------------------------
    //  Sign up with Firebase
    // -----------------------------
    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      note(signupNote, "");

      const name = suName.value.trim();
      const email = suEmail.value.trim();
      const password = suPwd.value.trim();
      const password2 = suPwd2.value.trim();
      const buildingName = suBuildingName.value.trim();
      const buildingLocation = suBuildingLocation.value.trim();

      if (!name || !email || !password || !buildingName || !buildingLocation) {
        return note(signupNote, "Please complete all fields.");
      }
      if (password !== password2) {
        return note(signupNote, "Passwords do not match.");
      }

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        const user = cred.user;

        // Save extra info in Firestore
        await setDoc(doc(db, "users", user.uid), {
          name,
          email,
          buildingName,
          buildingLocation,
          createdAt: new Date().toISOString()
        });

        // Send verification email
        await sendEmailVerification(user);

        note(
          signupNote,
          "Account created! Please check your email and verify your address before logging in.",
          "good"
        );

        // Reset form & go to login tab
        signupForm.reset();
        switchTab("login");
      } catch (err) {
        console.error(err);
        let msg = err.message;
        if (err.code === "auth/email-already-in-use") {
          msg = "This email is already registered.";
        } else if (err.code === "auth/weak-password") {
          msg = "Password should be at least 6 characters.";
        }
        note(signupNote, msg);
      }
    });

    // -----------------------------
    //  Login with Firebase
    // -----------------------------
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      note(loginNote, "");

      const email = loginEmail.value.trim();
      const password = loginPwd.value.trim();
      if (!email || !password) {
        return note(loginNote, "Please enter email & password.");
      }

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const user = cred.user;

        if (!user.emailVerified) {
          await sendEmailVerification(user);
          await signOut(auth);
          return note(
            loginNote,
            "Your email is not verified yet. We just sent you a verification email. Please check your inbox.",
            "good"
          );
        }

        const snap = await getDoc(doc(db, "users", user.uid));
        const profile = snap.exists() ? snap.data() : {};
        localStorage.setItem("gl_user", JSON.stringify({
          uid: user.uid,
          email: user.email,
          ...profile
        }));
        const token = await user.getIdToken();
        localStorage.setItem("gl_token", token);

        window.location.href = "WaterAudit - Dashboard.html";
      } catch (err) {
        console.error(err);
        let msg = err.message;
        if (err.code === "auth/user-not-found" || err.code === "auth/wrong-password") {
          msg = "Invalid email or password.";
        }
        note(loginNote, msg);
      }
    });

    // -----------------------------
    //  Forgot password (reset link)
    // -----------------------------
    forgotLink.addEventListener("click", async (e) => {
      e.preventDefault();
      const email = loginEmail.value.trim() || prompt("Enter your email:");
      if (!email) return;

      try {
        await sendPasswordResetEmail(auth, email);
        note(
          loginNote,
          "If this email is registered, we sent a password reset link.",
          "good"
        );
      } catch (err) {
        console.error(err);
        note(loginNote, err.message);
      }
    });

    // -----------------------------
    //  Resend verification email
    //  (requires correct email + password)
    // -----------------------------
    resendLink.addEventListener("click", async (e) => {
      e.preventDefault();
      note(loginNote, "");

      const email = loginEmail.value.trim();
      const password = loginPwd.value.trim();
      if (!email || !password) {
        return note(
          loginNote,
          'Enter your email and password first, then click "Resend verification".'
        );
      }

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const user = cred.user;
        await sendEmailVerification(user);
        await signOut(auth);
        note(
          loginNote,
          "Verification email resent. Please check your inbox.",
          "good"
        );
      } catch (err) {
        console.error(err);
        note(loginNote, err.message);
      }
    });
  </script>
</body>
</html>
