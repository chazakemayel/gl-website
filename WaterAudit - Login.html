<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Water Audit • Login / Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--green:#00a651;--line:#e5e7eb}
    *{box-sizing:border-box}
    body{margin:0;font-family:Poppins,Arial;background:linear-gradient(180deg,#e9f9ee,#eaf2f9)}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.08);width:min(780px,96vw);overflow:hidden}
    .head{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:18px 24px;font-weight:800}
    .tabs{display:flex;border-bottom:1px solid var(--line)}
    .tab{flex:1;text-align:center;padding:10px;cursor:pointer;font-weight:700;color:#334155}
    .tab.active{color:#0f172a;border-bottom:2px solid var(--green)}
    .body{padding:24px}
    form{display:grid;gap:12px}
    .row{display:grid;gap:12px}
    @media(min-width:760px){.row{grid-template-columns:1fr 1fr}}
    label{display:block;font-size:13px;color:#334155;margin-bottom:6px}
    input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}
    .btn{padding:12px;background:var(--green);color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer}
    .btn.secondary{background:#0ea5e9}
    .btn.ghost{background:#fff;color:#0f172a;border:1px solid var(--line)}
    .note{padding:10px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
    .note.good{background:#ecfdf5;border-color:#bbf7d0;color:#065f46}
    .note.hide{display:none}
    .hide{display:none}
    .sub{color:#64748b;font-size:14px}
    a.link{color:#0ea5e9;text-decoration:none;font-weight:700}
    .footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:16px 24px;color:#475569}
  </style>
  <script>
    const API_BASE = "https://gl-water-audit-api.onrender.com"; 
    const $ = s => document.querySelector(s);
    function note(el,msg,type){
      if(!el) return;
      if(!msg){ el.classList.add('hide'); el.textContent=''; el.classList.remove('good'); return; }
      el.textContent = msg;
      el.classList.remove('hide');
      el.classList.toggle('good', type==='good');
    }
    function switchTab(which){
      if(which==='login'){
        $('#loginView').classList.remove('hide'); $('#signupView').classList.add('hide');
        $('#tabLogin').classList.add('active');    $('#tabSignup').classList.remove('active');
      }else{
        $('#signupView').classList.remove('hide'); $('#loginView').classList.add('hide');
        $('#tabSignup').classList.add('active');   $('#tabLogin').classList.remove('active');
      }
    }
    // if already signed in, go to dashboard
    (function(){ try{ if(localStorage.getItem('gl_token')) location.href='WaterAudit - Dashboard.html'; }catch{} })();
  </script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <img src="images/GLLOGO.png" alt="logo" style="height:32px" onerror="this.style.display='none'">
        <span>Green Leaders — Water Audit</span>
      </div>

      <div class="tabs">
        <div id="tabLogin"  class="tab active">Login</div>
        <div id="tabSignup" class="tab">Sign Up</div>
      </div>

      <!-- LOGIN -->
      <section id="loginView" class="body">
        <div>
          <h1 style="margin:0 0 8px">Welcome back</h1>
          <p class="sub">Sign in to access your dashboard</p>
        </div>
        <div id="login_note" class="note hide"></div>

        <form id="loginForm">
          <div class="row">
            <div>
              <label>Email Address</label>
              <input id="login_email" type="email" placeholder="you@school.edu" required />
            </div>
            <div>
              <label>Password</label>
              <input id="login_pwd" type="password" placeholder="********" required />
            </div>
          </div>

          <div class="row" style="align-items:center">
            <button class="btn" type="submit">Sign in</button>
            <div style="display:flex; align-items:center; gap:10px">
              <span class="sub">No account?</span>
              <a id="goSignup" class="link" href="#">Create one</a>
            </div>
          </div>

          <div style="margin-top:6px; font-size:14px;">
            Didn’t get the verification email?
            <a href="#" id="resendLink" class="link">Resend verification</a>
          </div>
          <div style="margin-top:6px; font-size:14px;">
            <a href="#" id="forgotLink" class="link">Forgot password?</a>
          </div>
        </form>
      </section>

      <!-- SIGNUP -->
      <section id="signupView" class="body hide">
        <div>
          <h1 style="margin:0 0 8px">Create account</h1>
          <p class="sub">Sign up to start managing your water audit</p>
        </div>
        <div id="signup_note" class="note hide"></div>

        <form id="signupForm">
          <div class="row">
            <div>
              <label>Full Name</label>
              <input id="su_name" type="text" placeholder="Your name" required />
            </div>
            <div>
              <label>Email Address</label>
              <input id="su_email" type="email" placeholder="you@school.edu" required />
            </div>
          </div>

          <div class="row">
            <div>
              <label>Password</label>
              <input id="su_pwd" type="password" placeholder="********" required />
            </div>
            <div>
              <label>Confirm Password</label>
              <input id="su_pwd2" type="password" placeholder="********" required />
            </div>
          </div>

          <div class="row">
            <div>
              <label>Building Name</label>
              <input id="su_building_name" type="text" placeholder="e.g. Campus 1 – Block A" required />
            </div>
            <div>
              <label>Building Location</label>
              <input id="su_building_location" type="text" placeholder="e.g. Beirut, Lebanon" required />
            </div>
          </div>

          <div id="otpBlock" class="row hide">
            <div>
              <label>Verification Code (sent to your email)</label>
              <input id="su_code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" />
            </div>
            <div style="display:flex; align-items:flex-end;">
              <button id="resendOtpBtn" type="button" class="btn secondary" style="width:100%;">Resend Code</button>
            </div>
          </div>

          <button class="btn" type="submit" id="signupBtn">Create Account</button>
        </form>
      </section>

      <div class="footer">
        <div>© Green Leaders</div>
        <div><a class="link" href="#">Need help?</a></div>
      </div>
    </div>
  </div>

<script>
  // tab switching
  $('#tabLogin').addEventListener('click', ()=>switchTab('login'));
  $('#tabSignup').addEventListener('click', ()=>switchTab('signup'));
  $('#goSignup').addEventListener('click', (e)=>{ e.preventDefault(); switchTab('signup'); });

  // login
  $('#loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    note($('#login_note'),'');
    const email = $('#login_email').value.trim();
    const password = $('#login_pwd').value.trim();
    if(!email || !password) return note($('#login_note'),'Please enter email & password.');
    try{
      const r = await fetch(`${API_BASE}/api/auth/login`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({email,password}) 
      });
      if (r.status === 403) {
        const txt = await r.text();
        if (txt.includes('email_not_verified'))
          return note($('#login_note'),'Please verify your email first. Click "Resend verification".');
      }
      if(!r.ok) return note($('#login_note'), await r.text());
      const data = await r.json();
      localStorage.setItem('gl_token', data.token);
      localStorage.setItem('gl_user', JSON.stringify(data.user||{}));
      location.href = 'WaterAudit - Dashboard.html';
    }catch{ note($('#login_note'),'Network error — try again.'); }
  });

  // forgot password
  $('#forgotLink').addEventListener('click', async (e)=>{
    e.preventDefault();
    const email = $('#login_email').value.trim() || prompt('Enter your email:');
    if(!email) return;
    try{
      await fetch(`${API_BASE}/api/auth/forgot-password`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({email})
      });
      note($('#login_note'),'If the email exists, we sent a reset link to your inbox.','good');
    }catch{ note($('#login_note'),'Network error — try again.'); }
  });

  // signup with OTP (two-phase)
  let phase = 'collect';
  $('#signupForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    note($('#signup_note'),'');
    const name = $('#su_name').value.trim();
    const email = $('#su_email').value.trim();
    const password = $('#su_pwd').value.trim();
    const password2 = $('#su_pwd2').value.trim();
    const buildingName = $('#su_building_name').value.trim();
    const buildingLocation = $('#su_building_location').value.trim();

    if(!name || !email || !password || !buildingName || !buildingLocation)
      return note($('#signup_note'),'Please complete all fields.');
    if(password !== password2)
      return note($('#signup_note'),'Passwords do not match.');

    try{
      if(phase==='collect'){
        const r = await fetch(`${API_BASE}/api/auth/send-otp`,{
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({email})
        });
        if(!r.ok) return note($('#signup_note'), await r.text());
        document.getElementById('otpBlock').classList.remove('hide');
        document.getElementById('signupBtn').textContent = 'Verify & Create Account';
        phase='verify';
        return note($('#signup_note'),'We sent you a 6-digit code. Check your inbox.','good');
      }
      const code = document.getElementById('su_code').value.trim();
      if(!code) return note($('#signup_note'),'Please enter the verification code.');
      const r = await fetch(`${API_BASE}/api/auth/register-with-otp`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ name, email, password, buildingName, buildingLocation, code })
      });
      if(!r.ok) return note($('#signup_note'), await r.text());
      const data = await r.json();
      localStorage.setItem('gl_token', data.token);
      localStorage.setItem('gl_user', JSON.stringify(data.user||{}));
      location.href = 'WaterAudit - Dashboard.html';
    }catch{ note($('#signup_note'),'Network error — try again.'); }
  });

  // resend code
  document.getElementById('resendOtpBtn').addEventListener('click', async ()=>{
    const email = $('#su_email').value.trim();
    if(!email) return note($('#signup_note'),'Please enter your email first.');
    try{
      const r = await fetch(`${API_BASE}/api/auth/send-otp`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({email})
      });
      if(!r.ok) return note($('#signup_note'), await r.text());
      note($('#signup_note'),'✅ Verification code resent.','good');
    }catch{ note($('#signup_note'),'Network error — try again.'); }
  });

  // resend verification from login view (for users who created account but didn’t receive email)
  document.getElementById('resendLink').addEventListener('click', async (e)=>{
    e.preventDefault();
    const email = $('#login_email').value.trim() || prompt('Enter your email:');
    if(!email) return;
    try{
      const r = await fetch(`${API_BASE}/api/auth/resend-verification`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({email})
      });
      if(!r.ok) return note($('#login_note'), await r.text());
      note($('#login_note'),'✅ Verification email resent.','good');
    }catch{ note($('#login_note'),'Network error — try again.'); }
  });
</script>
</body>
</html>
